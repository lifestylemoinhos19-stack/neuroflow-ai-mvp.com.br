    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <meta name="theme-color" content="#0A192F" />

    <meta
      name="description"
      content="O NeuroFlow AI é uma solução avançada de suporte a decisão clínica que automatiza a triagem de TEA e TDAH."
    />
    <meta name="author" content="NeuroFlow AI" />

    <meta name="keywords" content="TEA, TDAH, Neurodesenvolvimento, EMT, Neuromodulação " />

  <body>
    <div id="root"></div>
    <!-- @skip-protected: Do not remove. Required for app features. -->
    <script src="https://goskip.dev/skip.js"></script>
    <!-- @skip-protected: Do not remove. App entrypoint. -->
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(function (registration) {
            // Check for updates periodically or on reload
            registration.addEventListener('updatefound', function () {
              var installingWorker = registration.installing;
              if (installingWorker) {
                installingWorker.onstatechange = function () {
                  if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // Prompt user for update or post message
                    if (window.confirm('Nova versão do NeuroFlow AI disponível! Deseja atualizar agora?')) {
                      installingWorker.postMessage({ type: 'SKIP_WAITING' });
                      window.location.reload();
                    }
                  }
                };
              }
            });
          }).catch(function () {});

          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function () {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
        });
      }
    </script>
  </body>
</html>
