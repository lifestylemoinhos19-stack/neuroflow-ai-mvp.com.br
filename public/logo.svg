<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0F2D53"/>
      <stop offset="60%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#050C1A"/>
    </radialGradient>
    
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00A8FF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#003366" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="brainGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80EEFF"/>
      <stop offset="50%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>

    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Neural Network Connections Background -->
  <g opacity="0.4" stroke="#00D2FF" stroke-width="1.5">
    <!-- Outer background network lines -->
    <line x1="80" y1="120" x2="160" y2="180" />
    <line x1="160" y1="180" x2="100" y2="280" />
    <line x1="100" y1="280" x2="60" y2="380" />
    <line x1="432" y1="120" x2="352" y2="180" />
    <line x1="352" y1="180" x2="412" y2="280" />
    <line x1="412" y1="280" x2="452" y2="380" />
    
    <line x1="160" y1="180" x2="256" y2="120" />
    <line x1="352" y1="180" x2="256" y2="120" />
    
    <line x1="80" y1="120" x2="200" y2="80" />
    <line x1="432" y1="120" x2="312" y2="80" />

    <!-- Nodes -->
    <circle cx="80" cy="120" r="4" fill="#00F0FF" />
    <circle cx="160" cy="180" r="4" fill="#00F0FF" />
    <circle cx="100" cy="280" r="4" fill="#00F0FF" />
    <circle cx="60" cy="380" r="4" fill="#00F0FF" />
    <circle cx="432" cy="120" r="4" fill="#00F0FF" />
    <circle cx="352" cy="180" r="4" fill="#00F0FF" />
    <circle cx="412" cy="280" r="4" fill="#00F0FF" />
    <circle cx="452" cy="380" r="4" fill="#00F0FF" />
    <circle cx="200" cy="80" r="4" fill="#00F0FF" />
    <circle cx="312" cy="80" r="4" fill="#00F0FF" />
    <circle cx="256" cy="120" r="5" fill="#FFFFFF" />
  </g>

  <!-- Central Glow aura -->
  <circle cx="256" cy="230" r="180" fill="url(#glow)"/>

  <!-- Brain Vector Graphic (Luminous Neural Fold Art) -->
  <g filter="url(#neon)">
    <!-- Main Brain Contour and Gyri Lines (Left & Right Hemispheres) -->
    <!-- Left Cortex -->
    <path d="M 250,130 
             C 210,120 160,130 130,165 
             C 100,200 95,250 110,290 
             C 120,315 140,335 170,340 
             C 200,345 220,330 235,315 
             C 245,305 248,280 250,260 Z" 
          fill="none" stroke="url(#brainGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right Cortex -->
    <path d="M 262,130 
             C 302,120 352,130 382,165 
             C 412,200 417,250 402,290 
             C 392,315 372,335 342,340 
             C 312,345 292,330 277,315 
             C 267,305 264,280 262,260 Z" 
          fill="none" stroke="url(#brainGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left Internal Folds / Sulci -->
    <path d="M 140,180 C 170,195 200,180 230,200" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 120,230 C 150,220 180,245 225,235" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 135,270 C 160,285 190,265 230,280" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 170,145 C 190,165 210,150 240,160" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 160,310 C 185,300 210,315 235,300" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Right Internal Folds / Sulci -->
    <path d="M 372,180 C 342,195 312,180 282,200" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 392,230 C 362,220 332,245 287,235" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 377,270 C 352,285 322,265 282,280" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 342,145 C 322,165 302,150 272,160" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 352,310 C 327,300 302,315 277,300" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Synaptic Nodes on Brain surface -->
    <circle cx="140" cy="180" r="4" fill="#FFFFFF"/>
    <circle cx="230" cy="200" r="4" fill="#FFFFFF"/>
    <circle cx="120" cy="230" r="4" fill="#FFFFFF"/>
    <circle cx="225" cy="235" r="4" fill="#FFFFFF"/>
    <circle cx="135" cy="270" r="4" fill="#FFFFFF"/>
    <circle cx="372" cy="180" r="4" fill="#FFFFFF"/>
    <circle cx="282" cy="200" r="4" fill="#FFFFFF"/>
    <circle cx="392" cy="230" r="4" fill="#FFFFFF"/>
    <circle cx="287" cy="235" r="4" fill="#FFFFFF"/>
    <circle cx="377" cy="270" r="4" fill="#FFFFFF"/>
    <circle cx="256" cy="130" r="5" fill="#80EEFF"/>
    <circle cx="256" cy="260" r="5" fill="#80EEFF"/>
  </g>

  <!-- Bold Central Typography: NeuroFlow AI -->
  <g filter="url(#textShadow)">
    <text x="256" y="275" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" 
          font-size="52" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="-1">NeuroFlow AI</text>
  </g>
</svg>
